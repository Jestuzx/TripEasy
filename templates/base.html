<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" title="theme" href="#">
</head>
<body>
    <div class="container">
        <header class="d-flex justify-content-center py-3">
            <h1>Welcome to TripEasy!</h1>
        </header>
        <header class="d-flex justify-content-center">
          <ul class="nav nav-pills">
            <li class="nav-item"><a href="/" class="btn btn-primary">Back to Home</a></li>
            <li class="nav-item"><a href="/profile" class="btn btn-primary mx-3">Go to Profile</a></li>
            <li class="nav-item"><a href="/registration" class="btn btn-outline-primary">Register</a></li>
          </ul>
        </header>
    </div>

    <div class="container mt-3">
        {% block content %}
        {% endblock %}
    </div>

    {% block scripts %}
    {% endblock %}
</body>
</html>
